<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Texas | Controle de Estoque</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <header class="cabecalho">
            <div class="logo">NT</div>
            <div>
                <h1>Nova Texas</h1>
                <p>Controle de estoque e produtos</p>
            </div>
        </header>

        <section class="painel">
            <h2>Cadastro de produtos</h2>
            <p class="descricao">Adicione ou atualize os produtos do estoque.</p>

            <form id="formProduto" novalidate>
                <div class="campo">
                    <label for="nome">Nome do produto</label>
                    <input type="text" id="nome" placeholder="Ex.: Camiseta" required>
                </div>

                <div class="linha-campos">
                    <div class="campo">
                        <label for="preco">Preço unitário (R$)</label>
                        <input type="number" id="preco" step="0.01" min="0.01"
                            placeholder="0,00" required>
                    </div>

                    <div class="campo">
                        <label for="quantidade">Quantidade</label>
                        <input type="number" id="quantidade" step="1" min="1"
                            placeholder="Ex.: 10" required>
                    </div>
                </div>

                <div class="botoes-form">
                    <button type="submit" id="btnAdicionar" class="btn-principal">
                        Adicionar produto
                    </button>
                    <button type="button" id="btnCancelarEdicao"
                        class="btn-secundario" hidden>
                        Cancelar edição
                    </button>
                </div>
            </form>
        </section>

        <section class="painel estoque">
            <div class="topo-estoque">
                <div>
                    <h2>Estoque de produtos</h2>
                    <p class="descricao">Confira os itens cadastrados.</p>
                </div>

                <button id="btnLimpar" class="btn-limpar" type="button">
                    Limpar tudo
                </button>
            </div>

            <div class="resumo">
                <span>Valor total dos produtos visíveis</span>
                <strong id="valorTotal">R$ 0,00</strong>
            </div>

            <div class="campo campo-busca">
                <label for="campo-busca">Pesquisar produto</label>
                <input
                    type="search"
                    id="campo-busca"
                    placeholder="Digite o nome do produto..."
                    autocomplete="off"
                >
            </div>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Produto</th>
                            <th>Preço unit.</th>
                            <th>Quantidade</th>
                            <th>Subtotal</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaProdutos"></tbody>
                </table>
            </div>
        </section>

        <footer>Nova Texas · Sistema de controle de estoque</footer>
    </main>
</body>
</html>
